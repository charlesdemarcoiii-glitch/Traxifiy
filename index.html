<script>
// ── NOTE HELPER ───────────────────────────────────────────────────────────────
function formatNote(note){
  if(!note) return "";
  return note.split("\n").filter(function(l){return l.trim();}).map(function(l){return "• "+l.trim();}).join("\n");
}

function renderNoteHTML(note){
  if(!note) return "";
  // Handle all line ending types: \r\n (Windows), \r (old Mac), \n (Unix/iPhone)
  return note.split(/\r\n|\r|\n/).filter(function(l){return l.trim();}).map(function(l){return "<div style='margin:3px 0'>• "+l.trim()+"</div>";}).join("");
}

// ── DATE HELPER ───────────────────────────────────────────────────────────────
function formatDate(ts){
  if(!ts) return "";
  try{
    const d=new Date(ts);
    return d.toLocaleString("en-US",{
      timeZone:"America/New_York",
      month:"short",day:"numeric",year:"numeric",
      hour:"numeric",minute:"2-digit",hour12:true
    });
  }catch(e){return ts;}
}

// ── FIRESTORE DATA LAYER ────────────────────────────────────────────────────
// Replaces Google Sheets — all reads/writes go through Firestore now

async function fsWaitForReady(){
  let tries=0;
  while(!window.fsGetAll && tries<100){
    await new Promise(r=>setTimeout(r,100));
    tries++;
  }
  if(!window.fsGetAll){
    console.error("Firestore failed to load after 10 seconds");
  }
}

async function getItemNames(){
  await fsWaitForReady();
  try{ return await window.fsGetAll(oc("itemNames")); }
  catch(e){ return []; }
}

async function addItemName(name){
  const id="item-"+Date.now();
  await window.fsSet(oc("itemNames"), id, {name:name, addedAt:new Date().toISOString()});
  return id;
}

async function getFacilities(){
  await fsWaitForReady();
  try{ return await window.fsGetAll(oc("facilities")); }
  catch(e){ return []; }
}

async function addFacility(facility){
  await window.fsSet(oc("facilities"), facility.id, facility);
}

async function getItems(){
  await fsWaitForReady();
  return await window.fsGetAll(oc("items"));
}

async function getOwners(){
  await fsWaitForReady();
  return await window.fsGetAll(oc("owners"));
}

async function getUsers(){
  await fsWaitForReady();
  if(!S.user || !S.user.email) return [];

  // Always fetch own record first — this is always allowed per security rules
  let ownRecord = null;
  try{
    ownRecord = await window.fsGetOne(oc("users"), S.user.email);
  }catch(e){
    console.error("Could not load own user record:",e);
  }

  const isAdmin = ownRecord && ownRecord.role==="admin";

  if(isAdmin){
    try{
      const all = await window.fsGetAll(oc("users"));
      return all.length>0 ? all : (ownRecord?[ownRecord]:[]);
    }catch(e){
      console.warn("Could not load all users, falling back to own record:",e);
    }
  }

  return ownRecord ? [ownRecord] : [];
}

async function getOrders(){
  await fsWaitForReady();
  return await window.fsGetAll(oc("orders"));
}

async function getLog(){
  await fsWaitForReady();
  return await window.fsGetAll(oc("log"));

async function findItemRow(barcode){
  const item = await window.fsGetOne(oc("items"), barcode);
  if(!item) return null;
  // Return in a format compatible with existing code: {rowNum, data: [barcode,name,type,expDate,ownerId,status,addedAt,usedBy]}
  return {
    rowNum: barcode, // Firestore uses doc ID instead of row number
    data: [item.barcode, item.name, item.type, item.expDate, item.ownerId, item.status, item.addedAt, item.usedBy||""]
  };
}

function setState(u){Object.assign(S,u);render();}
function showToast(msg,type="ok"){
  if(S.toastTimer)clearTimeout(S.toastTimer);

  setState({toast:{msg,type},toastTimer:t});

// ── DATA ──────────────────────────────────────────────────────────────────────
async function loadData(){
  setState({loading:true});
  try{
    const [ownersR,itemsR,logR,usersR,ordersR,facilitiesR,itemNamesR]=await Promise.allSettled([
      getOwners(),getItems(),getLog(),getUsers(),getOrders(),getFacilities(),getItemNames()
    ]);
    const owners = ownersR.status==="fulfilled" ? ownersR.value : S.owners;
    const items = itemsR.status==="fulfilled" ? itemsR.value : S.items.map(i=>({_id:i.barcode,...i}));
    const log = logR.status==="fulfilled" ? logR.value : [];
    const users = usersR.status==="fulfilled" ? usersR.value : S.users.map(u=>({_id:u.username,...u}));
    const orders = ordersR.status==="fulfilled" ? ordersR.value : S.orders.map(o=>({_id:o.id,...o}));
    const facilities = facilitiesR&&facilitiesR.status==="fulfilled" ? facilitiesR.value : S.facilities;
    const itemNamesData = itemNamesR&&itemNamesR.status==="fulfilled" ? itemNamesR.value : [];

    if(ownersR.status==="rejected")console.error("Owners load failed:",ownersR.reason);
    if(itemsR.status==="rejected")console.error("Items load failed:",itemsR.reason);
    if(logR.status==="rejected")console.error("Log load failed:",logR.reason);
    if(usersR.status==="rejected")console.error("Users load failed:",usersR.reason);
    if(ordersR.status==="rejected")console.error("Orders load failed:",ordersR.reason);

    setState({
      owners:owners.map(o=>({id:o._id||o.id,name:o.name,type:o.type})),
      items:items.map(i=>({barcode:i._id||i.barcode,name:i.name,type:i.type,expDate:i.expDate,ownerId:i.ownerId,status:i.status||"active",addedAt:i.addedAt,usedBy:i.usedBy||"",note:i.note||""})),
      log:log.map(l=>({ts:l.ts,action:l.action,barcode:l.barcode,itemName:l.itemName,from:l.from,to:l.to,user:l.user})).sort((a,b)=>new Date(b.ts)-new Date(a.ts)),
      users:users.map(u=>({username:u._id||u.username,role:u.role,ownerId:u.ownerId||"",viewableOwners:u.viewableOwners||[]})),
      orders:orders.map(o=>({id:o._id||o.id,name:o.name,count:o.count,createdBy:o.createdBy,createdAt:o.createdAt,status:o.status,items:o.items||""})),
      facilities:(facilities||[]).map(f=>({id:f._id||f.id,name:f.name})),
      customItemNames:(itemNamesData||[]).map(n=>n.name).filter(Boolean),
      loading:false
    });
  }catch(e){console.error("Load failed:",e);showToast("Could not load data","err");setState({loading:false});}
}

async function submitFacilityCheckout(item, facility){
  const now=new Date().toISOString();
  const fromName=S.owners.find(o=>o.id===item.ownerId)?.name||item.ownerId;
  // Optimistic UI — move item to facility
  const updatedItems=S.items.map(i=>i.barcode===item.barcode?{...i,ownerId:facility.id,status:"active"}:i);
  setState({items:updatedItems});
  showToast("🏥 "+item.name+" → "+facility.name);
  // Write to Firestore in background
  updateItem(item.barcode,{ownerId:facility.id,status:"active"})
    .then(()=>addLog({ts:now,action:"FACILITY_OUT",barcode:item.barcode,itemName:item.name,from:fromName,to:facility.name,user:S.user.username}))
    .catch(e=>{console.error("Facility checkout failed:",e);showToast("Failed: "+e.message,"err");});
}

async function submitUndoCheckout(item){
  const now=new Date().toISOString();

  // Find the last CHECK_OUT log entry for this item to get previous location
  const itemLog=S.log.filter(l=>l.barcode===item.barcode).slice(); // already sorted newest first
  const checkoutEntry=itemLog.find(l=>l.action==="CHECK_OUT");

  // Match owner by name (case-insensitive, trimmed) or by ID
  let returnOwner=null;
  if(checkoutEntry && checkoutEntry.from){
    const fromVal=checkoutEntry.from.trim().toLowerCase();
    returnOwner=S.owners.find(o=>
      o.name.trim().toLowerCase()===fromVal ||
      o.id.trim().toLowerCase()===fromVal
    );
  }
  // Fallback to Pool if we can't determine previous location
  if(!returnOwner) returnOwner=S.owners.find(o=>o.id.toUpperCase()==="POOL")||S.owners[0];
  
  console.log("Undo checkout - from log:", checkoutEntry?.from, "matched owner:", returnOwner?.name);

  // Optimistic UI
  const updatedItems=S.items.map(i=>i.barcode===item.barcode?{...i,status:"active",ownerId:returnOwner.id,usedBy:""}:i);
  setState({items:updatedItems});
  showToast("↩️ "+item.name+" returned to "+returnOwner.name);
  // Write to Firestore in background
  updateItem(item.barcode,{status:"active",ownerId:returnOwner.id,usedBy:""})
    .then(()=>addLog({ts:now,action:"UNDO_CHECKOUT",barcode:item.barcode,itemName:item.name,from:"USED",to:returnOwner.name,user:S.user.username}))
    .catch(e=>{console.error("Undo checkout failed:",e);showToast("Failed: "+e.message,"err");});
}

async function submitCheckin(barcode,name,type,expDate,ownerId,note){
  const now=new Date().toISOString();
  const ownerName=S.owners.find(o=>o.id===ownerId)?.name||ownerId;
  const orderRef=S.activeOrder?S.activeOrder.id:"";
  // Optimistic UI — update local state immediately
  const newItem={barcode,name,type,expDate,ownerId,status:"active",addedAt:now,usedBy:"",note:note||""};
  setState({items:[...S.items,newItem]});
  // Write to Firestore in background
  addItem(newItem);
  addLog({ts:now,action:"CHECK_IN",barcode,itemName:name,from:orderRef,to:ownerName,user:S.user.username});
}

async function submitMultiCheckin(){
  const {multiDetails,multiCodes,user,owners,activeOrder}=S;
  setState({loading:true,showMultiConfirm:false});
  const pool=owners.find(o=>o.id.toUpperCase()==="POOL")||owners[0];
  const now=new Date().toISOString();
  try{
    // Write all items and logs to Firestore
    for(const barcode of multiCodes){
      await addItem({barcode,name:multiDetails.name,type:multiDetails.type,expDate:multiDetails.expDate,ownerId:pool.id,status:"active",addedAt:now,usedBy:""});
      await addLog({ts:now,action:"CHECK_IN",barcode,itemName:multiDetails.name,from:"",to:pool.name,user:user.username});
    }
    showToast(`✅ ${multiCodes.length} items checked in to ${pool.name}`);
    setState({multiMode:false,multiDetails:null,multiCodes:[],showMultiDetails:false,showMultiScan:false,showMultiConfirm:false,activeOrder:null,scanMode:null});
    await loadData();
  }catch(e){showToast("Write failed — check permissions","err");setState({loading:false});}
}

async function submitTransfer(item,toOwnerId){
  const now=new Date().toISOString();
  const fromName=S.owners.find(o=>o.id===item.ownerId)?.name||item.ownerId;
  const toName=S.owners.find(o=>o.id===toOwnerId)?.name||toOwnerId;
  // Optimistic UI — update local state immediately
  const updatedItems=S.items.map(i=>i.barcode===item.barcode?{...i,ownerId:toOwnerId}:i);
  setState({modal:null,loading:false,items:updatedItems});
  showToast("🔄 "+item.name+" → "+toName);
  // Write to Firestore in background
  updateItem(item.barcode,{ownerId:toOwnerId})
    .then(()=>addLog({ts:now,action:"TRANSFER",barcode:item.barcode,itemName:item.name,from:fromName,to:toName,user:S.user.username}))
    .catch(e=>console.error("Transfer write failed:",e));
}

async function submitOrderCreate(orderQR, itemBarcodes, orderName){
  const now=new Date().toISOString();
  const user=S.user.username;
  const poolName=S.owners.find(o=>o.id.toUpperCase()==="POOL")?.name||"Pool";

  // Optimistic UI — update local state immediately
  const newOrder={id:orderQR,name:orderName||orderQR,count:itemBarcodes.length,createdBy:user,createdAt:now,status:"transit",items:itemBarcodes.join(",")};
  const updatedItems=S.items.map(i=>itemBarcodes.includes(i.barcode)?{...i,status:"transit",ownerId:"TRANSIT"}:i);
  setState({
    loading:false,
    showOrderSummary:false,
    orderItems:[],
    pendingOrderQR:null,
    showOrderGen:false,
    orders:[...S.orders,newOrder],
    items:updatedItems
  });
  showToast("📦 Order created! "+itemBarcodes.length+" items in transit");

  // Write to Firestore in background
  try{
    await addOrder(newOrder);
    for(const barcode of itemBarcodes){
      await updateItem(barcode,{ownerId:"TRANSIT",status:"transit"});
      await addLog({ts:now,action:"ORDER_OUT",barcode,itemName:"",from:poolName,to:"TRANSIT",user});
    }
  }catch(e){
    console.error("Order create background write failed:",e);
  }
}

let orderReceiveInProgress = false;
async function submitOrderReceive(orderQR, toOwnerId){
  if(orderReceiveInProgress){return;}
  orderReceiveInProgress = true;
  setState({modal:null,loading:true});
  const now=new Date().toISOString();
  const user=S.user.username;
  const toName=S.owners.find(o=>o.id===toOwnerId)?.name||toOwnerId;
  try{
    const orderRow=S.orders.find(o=>o.id===orderQR);
    if(!orderRow){showToast("Order not found","err");setState({loading:false});orderReceiveInProgress=false;return;}
    const barcodes=(orderRow.items||"").split(",").filter(b=>b.trim());
    if(barcodes.length===0){showToast("No items found in order","err");setState({loading:false});orderReceiveInProgress=false;return;}

    // Update each item's owner in Firestore
    for(const barcode of barcodes){
      await updateItem(barcode,{ownerId:toOwnerId,status:"active"});
      await addLog({ts:now,action:"ORDER_IN",barcode,itemName:"",from:"TRANSIT",to:toName,user});
    }

    // Update order status to received
    await updateOrder(orderQR,{status:"received"});

    showToast("✅ "+barcodes.length+" items received into "+toName);
    await loadData();
  }catch(e){
    showToast("Failed: "+e.message,"err");
    setState({loading:false});
  }finally{
    orderReceiveInProgress=false;
  }
}

function handleScan(barcode){
  const {scanMode,activeOrder,items,multiCodes,showMultiScan}=S;
  stopScanner();

  // Order item scan mode — collecting items for a new order
  if(S.showOrderItemScan){
    const item=items.find(i=>i.barcode===barcode);
    if(item){
      if(item.status==="used"){showToast("Item already used","warn");setState({scanning:true});return;}
      if(item.status==="transit"){showToast("Item already in transit","warn");setState({scanning:true});return;}
      if(S.orderItems.includes(barcode)){showToast("Already added to order","warn");setState({scanning:true});return;}
      const newItems=[...S.orderItems,barcode];
      setState({orderItems:newItems,scanning:true});
      showToast("📦 "+newItems.length+" item"+(newItems.length>1?"s":"")+" added to order");
    } else {
      showToast("Item not found — must be checked in first","err");
      setState({scanning:true});
    }
    return;
  }

  // Order QR scan mode — scanning the master QR for the order
  if(S.showOrderQRScan){
    // Make sure this barcode isn't already an order
    if(S.orders.find(o=>o.id===barcode)){showToast("This QR is already an order","err");setState({scanning:true});return;}
    // Make sure it's not an active item
    const existingItem=items.find(i=>i.barcode===barcode);
    if(existingItem&&existingItem.status==="active"&&!S.orderItems.includes(barcode)){
      showToast("This QR belongs to an active item — use a blank QR","warn");setState({scanning:true});return;
    }
    setState({scanning:false,showOrderQRScan:false,pendingOrderQR:barcode,showOrderSummary:true});
    return;
  }

  // Multi-scan mode — just collect codes
  if(showMultiScan){
    if(items.find(i=>i.barcode===barcode)){showToast("Already tracked: "+barcode,"warn");setState({scanning:true});return;}
    if(multiCodes.includes(barcode)){showToast("Already scanned this code","warn");setState({scanning:true});return;}
    const newCodes=[...multiCodes,barcode];
    setState({multiCodes:newCodes,scanning:true});
    showToast(`📦 Code ${newCodes.length} scanned`);
    return;
  }

  setState({scanning:false});

  if(scanMode==="order"&&!activeOrder){
    const order=S.orders.find(o=>o.id===barcode);
    if(!order){showToast("Order not found","err");return;}
    setState({activeOrder:order,scanning:true,scanHint:"Scan items to add to order"});
    showToast(`📦 Order: ${order.name} — scan items`);
    return;
  }
  if(scanMode==="order"&&activeOrder){
    if(items.find(i=>i.barcode===barcode)){showToast("Already tracked","warn");setState({scanning:true});return;}
    setState({modal:{type:"checkin",barcode,orderMode:true}});return;
  }
  if(scanMode==="checkin"){
    if(items.find(i=>i.barcode===barcode)){showToast("Already tracked — item exists","warn");return;}
    setState({modal:{type:"checkin",barcode,orderMode:false}});return;
  }
  if(scanMode==="checkout"){
    const item=items.find(i=>i.barcode===barcode);
    if(!item){showToast("Item not found","err");return;}
    if(item.status==="used"){showToast("Already checked out","warn");return;}
    if(S.user.role!=="admin"&&item.ownerId!==S.user.ownerId){showToast("You can only check out items in your own inventory","err");return;}
    setState({modal:{type:"checkout",item}});return;
  }
  if(scanMode==="transfer"){
    // Check if this is an order QR code first
    const order=S.orders.find(o=>o.id===barcode);
    if(order){
      if(order.status==="received"){showToast("Order already received","warn");return;}
      const barcodes=(order.items||"").split(",").filter(b=>b.trim());
      if(barcodes.length===0){showToast("Order has no items","warn");return;}
      setState({modal:{type:"receive_order",order,barcodes,toOwnerId:S.user.role==="admin"?"":S.user.ownerId}});
      return;
    }
    const item=items.find(i=>i.barcode===barcode);
    if(!item){showToast("Item not found — check in first","err");return;}
    if(item.status==="used"){showToast("Item already used","warn");return;}
    if(item.status==="transit"){showToast("Item is in transit — receive the order instead","warn");return;}
    if(S.user.role!=="admin"&&item.ownerId===S.user.ownerId){
      showToast("Item is already in your inventory","warn");return;
    }
    // Check if item is at a facility — show friendly transfer back message
    const isFacilityItem=S.facilities&&S.facilities.find(f=>f.id===item.ownerId);
    if(isFacilityItem){
      setState({modal:{type:"transfer",item,facilityTransfer:true,facilityName:isFacilityItem.name}});
    } else {
      setState({modal:{type:"transfer",item}});
    }
  }
}

// ── SCANNER ───────────────────────────────────────────────────────────────────
let scanStream=null,scanInterval=null,scanActive=false;
function startScanner(){
  scanActive=true;
  const video=document.getElementById("scan-video");
  const canvas=document.getElementById("scan-canvas");
  const status=document.getElementById("scan-status");
  if(!video||!canvas)return;
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}})
    .then(stream=>{
      // If stopScanner() was called before this promise resolved, kill the stream immediately
      if(!scanActive){
        stream.getTracks().forEach(t=>t.stop());
        return;
      }
      scanStream=stream;video.srcObject=stream;video.play();
      if(window.jsQR){
        if(status)status.textContent=S.scanHint||"Point camera at QR code";
        scanInterval=setInterval(()=>{
          if(!scanActive){clearInterval(scanInterval);return;}
          if(video.readyState!==4)return;
          const size=Math.min(video.videoWidth,video.videoHeight)*0.8;
          const x=(video.videoWidth-size)/2,y=(video.videoHeight-size)/2;
          canvas.width=size;canvas.height=size;
          const ctx=canvas.getContext("2d");
          ctx.drawImage(video,x,y,size,size,0,0,size,size);
          const img=ctx.getImageData(0,0,size,size);
          const code=window.jsQR(img.data,img.width,img.height,{inversionAttempts:"dontInvert"});
          if(code&&code.data)handleScan(code.data);
        },150);
      }else{if(status)status.textContent="Type code manually below";}
    })
    .catch(()=>{const s=document.getElementById("scan-status");if(s)s.textContent="Camera unavailable — type code below";});
}
function stopScanner(){
  scanActive=false;
  clearInterval(scanInterval);scanInterval=null;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}
  // iOS Safari requires nulling srcObject to fully release the camera hardware
  const video=document.getElementById("scan-video");
  if(video){video.pause();video.srcObject=null;}
}

// ── EL HELPER ─────────────────────────────────────────────────────────────────
function el(tag,attrs={},...children){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==="onclick")e.onclick=v;
    else if(k==="onchange")e.onchange=v;
    else if(k==="oninput")e.oninput=v;
    else if(k==="onkeydown")e.onkeydown=v;
    else if(k==="style")Object.assign(e.style,v);
    else if(k==="class")e.className=v;
    else e.setAttribute(k,v);
  }
  for(const c of children){
    if(c==null)continue;
    if(typeof c==="string"||typeof c==="number")e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

// ── MULTI-TENANT: CREATE / JOIN ───────────────────────────────────────────────
function genCode(){ return Math.random().toString(36).substr(2,6).toUpperCase(); }

async function createOrg(orgName, adminEmail){
  const slug=orgName.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").substring(0,24);
  const orgId=slug+"-"+Math.random().toString(36).substr(2,4);
  const inviteCode=genCode();
  await window.fsSet("orgs",orgId,{name:orgName,createdBy:adminEmail,createdAt:new Date().toISOString(),inviteCode});
  await window.fsSet("orgs/"+orgId+"/users",adminEmail,{role:"admin",ownerId:"",viewableOwners:[]});
  await window.fsSet("userOrgs",adminEmail,{orgId});
  // Default inventory pool every new org starts with
  await window.fsSet("orgs/"+orgId+"/owners","unclaimed",{id:"unclaimed",name:"Unclaimed",type:"pool"});
  return {orgId,inviteCode,orgName};
}

async function joinOrgByCode(code, userEmail){
  const allOrgs=await window.fsGetAll("orgs");
  const org=allOrgs.find(o=>(o.inviteCode||"").toUpperCase()===(code||"").toUpperCase().trim());
  if(!org) throw new Error("Invalid invite code — check with your admin");
  const orgId=org._id;
  await window.fsSet("orgs/"+orgId+"/users",userEmail,{role:"user",ownerId:"",viewableOwners:[]});
  await window.fsSet("userOrgs",userEmail,{orgId});
  return {orgId,orgName:org.name,orgInviteCode:org.inviteCode};
}

function render(){
  if(!S.scanning) stopScanner();
  const app=document.getElementById("app");
  app.innerHTML="";
  if(!S.user){app.appendChild(renderLogin());return;}
  if(!S.orgId){app.appendChild(renderOnboarding());return;}
  app.appendChild(renderApp());
  if(S.scanning){app.appendChild(renderScanner());setTimeout(startScanner,100);}
  if(S.showScanPrompt)app.appendChild(renderScanPrompt());
  if(S.showMultiDetails)app.appendChild(renderMultiDetails());
  if(S.showMultiScan)app.appendChild(renderMultiScan());
  if(S.showMultiConfirm)app.appendChild(renderMultiConfirm());
  if(S.showOrderGen)app.appendChild(renderOrderGen());
  if(S.showOrderSummary)app.appendChild(renderOrderSummary());
  if(S.showSettings)app.appendChild(renderSettings());
  if(S.modal)app.appendChild(renderModal());
  if(S.toast)app.appendChild(renderToast());
}

              const u={username:firebaseEmail,email:firebaseEmail,role:"user",ownerId:""};

            const orgId=userOrgData.orgId;
            let userRecord=null,orgInfo=null;
            try{userRecord=await window.fsGetOne("orgs/"+orgId+"/users",firebaseEmail);}catch(e){}
            try{orgInfo=await window.fsGetOne("orgs",orgId);}catch(e){}

              ?{username:firebaseEmail,email:firebaseEmail,role:userRecord.role||"user",ownerId:userRecord.ownerId||""}
              :{username:firebaseEmail,email:firebaseEmail,role:"user",ownerId:""};
            const existing=S.accounts.find(a=>a.username.toLowerCase()===u.username.toLowerCase());
            setState({user:u,orgId,orgName:orgInfo?.name||orgId,orgInviteCode:orgInfo?.inviteCode||"",accounts:existing?S.accounts:[...S.accounts,u],showAccountMenu:false});
            loadData();
          })
          .catch(function(err){
            let msg="Incorrect email or password";
            if(err.code==="auth/user-not-found"||err.code==="auth/invalid-credential")msg="No account found — check your email or sign up";
            if(err.code==="auth/wrong-password")msg="Incorrect password";
            if(err.code==="auth/invalid-email")msg="Invalid email address";

      card.appendChild(hdr);

      const box=document.createElement("div");
      box.style.cssText="background:#111827;border-radius:16px;padding:24px;border:1px solid #1e293b;";

      const note=document.createElement("p");
      note.style.cssText="color:#475569;font-size:12px;margin:0 0 18px;line-height:1.5;";
      note.textContent="After creating your account you'll choose to start a new inventory (admin) or join an existing one with an invite code.";
      box.appendChild(note);

      function mkField(labelText,type,placeholder,onInput,onEnter){
        const lbl=document.createElement("label");
        lbl.style.cssText="color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;";
        lbl.textContent=labelText;
        const inp=document.createElement("input");
        inp.type=type;inp.placeholder=placeholder;
        inp.style.cssText="width:100%;background:#0f172a;border:1px solid #334155;border-radius:9px;color:#f1f5f9;padding:13px 14px;font-size:15px;font-family:inherit;margin-bottom:14px;box-sizing:border-box;outline:none;";
        inp.oninput=function(){onInput(this.value);};
        if(onEnter)inp.onkeydown=function(e){if(e.key==="Enter")onEnter();};
        box.appendChild(lbl);box.appendChild(inp);
        return inp;
      }

      mkField("Email","email","your@email.com",function(v){email=v;},null);
      mkField("Password","password","At least 6 characters",function(v){password=v;},null);
      mkField("Confirm Password","password","Repeat password",function(v){confirm=v;},doCreate);

      const errDiv=document.createElement("div");
      errDiv.style.cssText="min-height:24px;margin-bottom:4px;";
      box.appendChild(errDiv);

      const createBtn=document.createElement("button");
      createBtn.style.cssText="width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit;margin-top:4px;";
      createBtn.textContent="Create Account →";
      createBtn.onclick=doCreate;
      box.appendChild(createBtn);
      card.appendChild(box);

      function doCreate(){
        if(!email||!password||!confirm){errDiv.innerHTML="<p style='color:#f87171;font-size:13px;text-align:center;margin:6px 0 0'>⚠ Fill in all fields</p>";return;}
        if(password!==confirm){errDiv.innerHTML="<p style='color:#f87171;font-size:13px;text-align:center;margin:6px 0 0'>⚠ Passwords don't match</p>";return;}
        if(password.length<6){errDiv.innerHTML="<p style='color:#f87171;font-size:13px;text-align:center;margin:6px 0 0'>⚠ Password must be at least 6 characters</p>";return;}
        createBtn.textContent="Creating…";createBtn.disabled=true;
        window.firebaseCreateUser(email,password)
          .then(async function(cred){
            const firebaseEmail=cred.user.email;
            await fsWaitForReady();
            // New user — no org yet, go to onboarding
            const u={username:firebaseEmail,email:firebaseEmail,role:"user",ownerId:""};
            setState({user:u,orgId:null,orgName:null,orgInviteCode:null,accounts:[...S.accounts,u],showAccountMenu:false});
          })
          .catch(function(err){
            let msg="Could not create account";
            if(err.code==="auth/email-already-in-use")msg="An account with this email already exists — try signing in";
            if(err.code==="auth/invalid-email")msg="Invalid email address";
            if(err.code==="auth/weak-password")msg="Password is too weak — use at least 6 characters";
            errDiv.innerHTML="<p style='color:#f87171;font-size:13px;text-align:center;margin:6px 0 0'>⚠ "+msg+"</p>";
            createBtn.textContent="Create Account →";createBtn.disabled=false;
          });
      }
    }
  }

  rebuild();
  return wrap;
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function renderApp(){
  const {user,items,owners,orders,log,tab,loading,selectedOwner,activeOrder,multiMode,multiCodes}=S;
  const isAdmin=user.role==="admin";

  // Separate active and used items
  const activeItems=items.filter(i=>i.status!=="used");
  const usedItems=items.filter(i=>i.status==="used");
  const visActiveItems=isAdmin?activeItems:activeItems.filter(i=>i.ownerId===user.ownerId);
  const visUsedItems=isAdmin?usedItems:usedItems.filter(i=>i.usedBy===user.username);
  const visOwners=isAdmin?owners.filter(o=>o.id!=="USED"):owners.filter(o=>o.id===user.ownerId);
  const expSoon=visActiveItems.filter(i=>{if(!i.expDate)return false;const d=(new Date(i.expDate)-Date.now())/86400000;return d>=0&&d<=120;});
  const expired=visActiveItems.filter(i=>i.expDate&&new Date(i.expDate)<new Date());

  const wrap=el("div",{class:"page"});

  // HEADER
  const header=el("div",{style:{background:"#111827",borderBottom:"1px solid #1e293b",padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:"0",zIndex:"100"}});
  const logo=el("div",{style:{display:"flex",alignItems:"center",gap:"10px"}});
  logo.innerHTML=`<span style="font-size:22px">📦</span><div><span style="font-weight:800;font-size:18px;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Traxify</span>${S.orgName?`<div style="color:#475569;font-size:10px;font-weight:600;margin-top:-1px;letter-spacing:.03em">${S.orgName}</div>`:""}</div>`;
  const hRight=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",position:"relative"}});
  
  // Account switcher button
  const acctBtn=el("button",{style:{background:"#1e293b",border:"1px solid #334155",borderRadius:"8px",padding:"6px 10px",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}});
  acctBtn.innerHTML=`<div style="text-align:right"><div style="color:#f1f5f9;font-size:13px;font-weight:700">${user.username}</div><div style="color:${isAdmin?"#818cf8":"#38bdf8"};font-size:10px;text-transform:uppercase;font-weight:600">${user.role}</div></div><span style="color:#64748b;font-size:10px">▾</span>`;
  acctBtn.onclick=()=>setState({showAccountMenu:!S.showAccountMenu});
  hRight.appendChild(acctBtn);

  // Account dropdown menu
  if(S.showAccountMenu){
    const menu=el("div",{style:{position:"absolute",top:"44px",right:"0",background:"#1e293b",border:"1px solid #334155",borderRadius:"12px",padding:"8px",zIndex:"1000",minWidth:"180px",boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}});
    
    // Signed in accounts
    S.accounts.forEach(acct=>{
      const isActive=acct.username===user.username;
      const row=el("button",{style:{width:"100%",padding:"10px 12px",borderRadius:"8px",border:"none",background:isActive?"#0ea5e918":"transparent",color:isActive?"#38bdf8":"#f1f5f9",fontWeight:isActive?"700":"400",fontSize:"13px",display:"flex",alignItems:"center",gap:"8px",cursor:"pointer",marginBottom:"2px",textAlign:"left"}});
      row.innerHTML=`<span style="font-size:16px">${acct.role==="admin"?"👑":"👤"}</span><div><div>${acct.username}</div><div style="font-size:10px;color:${isActive?"#38bdf8":"#64748b"};text-transform:uppercase">${acct.role}${isActive?" · Active":""}</div></div>`;
      if(!isActive){
        row.onclick=()=>{setState({user:acct,tab:"dashboard",showAccountMenu:false});};
      }
      menu.appendChild(row);
    });

    // Divider
    menu.appendChild(el("div",{style:{height:"1px",background:"#334155",margin:"6px 0"}}));

    // Add account button
    const addBtn=el("button",{style:{width:"100%",padding:"10px 12px",borderRadius:"8px",border:"none",background:"transparent",color:"#22c55e",fontSize:"13px",fontWeight:"600",display:"flex",alignItems:"center",gap:"8px",cursor:"pointer"}});
    addBtn.innerHTML=`<span>＋</span> Add Account`;
    addBtn.onclick=()=>setState({user:null,showAccountMenu:false});
    menu.appendChild(addBtn);

    // Sign out all
    const outAllBtn=el("button",{style:{width:"100%",padding:"10px 12px",borderRadius:"8px",border:"none",background:"transparent",color:"#f87171",fontSize:"13px",fontWeight:"600",display:"flex",alignItems:"center",gap:"8px",cursor:"pointer"}});
    outAllBtn.innerHTML=`<span>⇥</span> Sign Out All`;
    outAllBtn.onclick=()=>{if(window.firebaseSignOut)window.firebaseSignOut();setState({user:null,accounts:[],showAccountMenu:false,tab:"dashboard"});};
    menu.appendChild(outAllBtn);

    hRight.appendChild(menu);
    // Close menu when clicking outside
    setTimeout(()=>{
      document.addEventListener("click",function closeMenu(e){
        if(!acctBtn.contains(e.target)&&!menu.contains(e.target)){
          setState({showAccountMenu:false});
          document.removeEventListener("click",closeMenu);
        }
      });
    },0);
  }

  const syncBtn=el("button",{style:{padding:"8px 10px",borderRadius:"8px",background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:"14px"}},"⟳");
  syncBtn.onclick=loadData;
  hRight.appendChild(syncBtn);
  if(isAdmin){
    const gearBtn=el("button",{style:{padding:"8px 10px",borderRadius:"8px",background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:"16px"}},"⚙️");
    gearBtn.onclick=()=>setState({showSettings:true});
    hRight.appendChild(gearBtn);
  }
  header.appendChild(logo);header.appendChild(hRight);
  wrap.appendChild(header);

  // ORDER BANNER
  if(activeOrder){
    const banner=el("div",{style:{background:"#1e1b4b",borderBottom:"1px solid #4338ca",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}});
    banner.innerHTML=`<span style="color:#818cf8;font-weight:700;font-size:13px">🗃 ${activeOrder.name}</span>`;
    const endBtn=el("button",{style:{background:"none",border:"none",color:"#6366f1",fontSize:"13px",fontWeight:"600"}},"End");
    endBtn.onclick=()=>setState({activeOrder:null,scanMode:null});
    banner.appendChild(endBtn);wrap.appendChild(banner);
  }

  // ACTION BAR
  const actions=el("div",{style:{display:"flex",gap:"8px",padding:"12px 16px",background:"#0f172a",borderBottom:"1px solid #1e293b"}});
  if(isAdmin){
    const btn=el("button",{class:"action-btn",style:{background:"#22c55e18",border:"1px solid #22c55e33",color:"#22c55e"}});
    btn.innerHTML=`<span style="font-size:20px">📥</span><span>Check In</span>`;
    btn.onclick=()=>setState({scanMode:"checkin",showScanPrompt:true});
    actions.appendChild(btn);
  }
  [["checkout","📤","Check Out","#f59e0b"],["transfer","🔄","Transfer","#6366f1"]].forEach(([mode,icon,label,color])=>{
    const btn=el("button",{class:"action-btn",style:{background:`${color}18`,border:`1px solid ${color}33`,color}});
    btn.innerHTML=`<span style="font-size:20px">${icon}</span><span>${label}</span>`;
    btn.onclick=()=>setState({scanMode:mode,scanning:true,scanHint:"Point camera at QR code"});
    actions.appendChild(btn);
  });
  if(isAdmin){
    const btn=el("button",{class:"action-btn",style:{background:"#a855f718",border:"1px solid #a855f733",color:"#c084fc"}});
    btn.innerHTML=`<span style="font-size:20px">🗃</span><span>Order</span>`;
    btn.onclick=()=>setState({orderItems:[],showOrderItemScan:true,showOrderQRScan:false,showOrderSummary:false,pendingOrderQR:null,scanning:true,scanHint:"Scan items to add to order"});
    actions.appendChild(btn);
  }
  wrap.appendChild(actions);

  // TABS
  const tabs=el("div",{style:{display:"flex",borderBottom:"1px solid #1e293b",background:"#111827"}});
  [["dashboard","Dashboard"],["inventory","Inventory"],["capital","Trays & Capital"],["used","Used"],["orders","Orders"],["log","Log"],...(isAdmin?[["users","👥 Users"]]:[])].forEach(([id,label])=>{
    const btn=el("button",{class:"tab-btn",style:{color:tab===id?"#38bdf8":"#475569",fontWeight:tab===id?"700":"500",borderBottom:tab===id?"2px solid #38bdf8":"2px solid transparent",fontSize:"12px"}},label);
    btn.onclick=()=>setState({tab:id});
    tabs.appendChild(btn);
  });
  wrap.appendChild(tabs);

  // CONTENT
  const content=el("div",{style:{padding:"16px",maxWidth:"480px",margin:"0 auto",paddingBottom:"32px"}});
  if(loading)content.appendChild(el("p",{style:{textAlign:"center",color:"#475569",fontSize:"13px"}},"Loading…"));

  // DASHBOARD
  if(tab==="dashboard"){
    const welcome=el("div",{class:"card",style:{background:"linear-gradient(135deg,#0ea5e918,#6366f118)",marginBottom:"12px"}});
    welcome.innerHTML=`<p style="margin:0;color:#94a3b8;font-size:14px">Welcome, <span style="color:#f1f5f9;font-weight:700">${user.username}</span>${isAdmin?'<span style="color:#818cf8;font-weight:600"> · Admin</span>':''}</p>`;
    content.appendChild(welcome);
    const stats=el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:"8px",marginBottom:"12px"}});
    [["Active",visActiveItems.length,"#38bdf8"],["Expiring",expSoon.length,"#f59e0b"],["Expired",expired.length,"#ef4444"],["Used",visUsedItems.length,"#94a3b8"]].forEach(([label,val,color])=>{
      const s=el("div",{style:{background:"#111827",borderRadius:"12px",padding:"12px 6px",border:`1px solid ${color}33`,textAlign:"center"}});
      s.innerHTML=`<div style="color:${color};font-size:22px;font-weight:800">${val}</div><div style="color:#64748b;font-size:10px;margin-top:2px">${label}</div>`;
      stats.appendChild(s);
    });
    content.appendChild(stats);
    if(expired.length>0){
      const alert=el("div",{style:{background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"10px",padding:"14px",marginBottom:"8px"}});
      alert.innerHTML=`<p style="color:#fca5a5;font-weight:700;font-size:13px;margin:0 0 8px">⚠️ Expired (${expired.length})</p>${expired.map(i=>`<p style="color:#f87171;font-size:12px;margin:2px 0">• ${i.name} — ${i.expDate}</p>`).join("")}`;
      content.appendChild(alert);
    }
    if(expSoon.length>0){
      const alert=el("div",{style:{background:"#431407",border:"1px solid #78350f",borderRadius:"10px",padding:"14px",marginBottom:"8px"}});
      alert.innerHTML=`<p style="color:#fcd34d;font-weight:700;font-size:13px;margin:0 0 8px">⏰ Expiring Within 120 Days (${expSoon.length})</p>${expSoon.map(i=>{const d=Math.ceil((new Date(i.expDate)-Date.now())/86400000);return`<p style="color:#fbbf24;font-size:12px;margin:2px 0">• ${i.name} — ${d}d left</p>`;}).join("")}`;
      content.appendChild(alert);
    }
    content.appendChild(el("p",{style:{color:"#475569",fontSize:"11px",fontWeight:"600",margin:"12px 0 8px",textTransform:"uppercase",letterSpacing:".07em"}},isAdmin?"All Inventories":"Your Inventory"));
    visOwners.forEach(owner=>{
      const oi=activeItems.filter(i=>i.ownerId===owner.id);
      const oe=oi.filter(i=>i.expDate&&new Date(i.expDate)<new Date());
      const card=el("div",{class:"card",style:{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"}});
      const icon=owner.id.toUpperCase()==="POOL"?"🏪":owner.type==="locker"?"🗄":"👤";
      card.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><span style="font-size:22px">${icon}</span><div><div style="font-weight:700;color:#f1f5f9;font-size:14px">${owner.name}</div><div style="color:#64748b;font-size:11px">${owner.type}</div></div></div><div style="text-align:right"><div style="font-weight:700;color:#38bdf8;font-size:20px">${oi.length}</div>${oe.length>0?`<div style="color:#ef4444;font-size:11px">${oe.length} exp</div>`:""}</div>`;
      card.onclick=()=>setState({selectedOwner:owner,tab:"inventory"});
      content.appendChild(card);
    });
  }

  // INVENTORY
  if(tab==="inventory"){
    if(isAdmin){
      const filters=el("div",{style:{display:"flex",gap:"8px",marginBottom:"12px",flexWrap:"wrap"}});
      const allBtn=el("button",{style:{padding:"7px 14px",borderRadius:"7px",border:"1px solid #334155",background:!selectedOwner?"#0ea5e9":"#1e293b",color:!selectedOwner?"#fff":"#94a3b8",fontSize:"13px",fontWeight:"600"}},"All");
      allBtn.onclick=()=>setState({selectedOwner:null});
      filters.appendChild(allBtn);
      owners.filter(o=>o.id!=="USED").forEach(o=>{
        const icon=o.id.toUpperCase()==="POOL"?"🏪":o.type==="locker"?"🗄":"👤";
        const btn=el("button",{style:{padding:"7px 14px",borderRadius:"7px",border:"1px solid #334155",background:selectedOwner?.id===o.id?"#0ea5e9":"#1e293b",color:selectedOwner?.id===o.id?"#fff":"#94a3b8",fontSize:"13px",fontWeight:"600"}},`${icon} ${o.name}`);
        btn.onclick=()=>setState({selectedOwner:o});
        filters.appendChild(btn);
      });
      content.appendChild(filters);
    }
    // Search bar
    const searchWrap=document.createElement("div");
    searchWrap.style.cssText="position:relative;margin-bottom:12px;";
    const searchInput=document.createElement("input");
    searchInput.type="text";
    searchInput.placeholder="🔍  Search by name or barcode…";
    searchInput.style.cssText="width:100%;box-sizing:border-box;";
    searchInput.value=S.inventorySearch||"";
    let searchDebounce=null;
    searchInput.oninput=function(){
      const val=this.value;
      clearTimeout(searchDebounce);
      searchDebounce=setTimeout(function(){setState({inventorySearch:val});},800);
    };
    searchWrap.appendChild(searchInput);
    content.appendChild(searchWrap);

    const searchTerm=(S.inventorySearch||"").toLowerCase().trim();
    const baseItems=isAdmin?(selectedOwner?activeItems.filter(i=>i.ownerId===selectedOwner.id):activeItems):visActiveItems;
    const displayItems=searchTerm?baseItems.filter(i=>i.name.toLowerCase().includes(searchTerm)||i.barcode.toLowerCase().includes(searchTerm)):baseItems;
    // Show count summary per item type for selected owner
    if(displayItems.length>0){
      const itemTypes=(S.customItemNames||[]);
      const counts={};
      displayItems.forEach(function(item){
        if(itemTypes.includes(item.name)){
          counts[item.name]=(counts[item.name]||0)+1;
        }
      });
      const hasKnown=Object.keys(counts).length>0;
      if(hasKnown){
        const summaryCard=document.createElement("div");
        summaryCard.style.cssText="background:#111827;border-radius:12px;border:1px solid #1e293b;padding:14px 16px;margin-bottom:16px;";
        const summaryTitle=document.createElement("p");
        summaryTitle.style.cssText="color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px;";
        if(!isAdmin){
          // Regular users always see their own inventory count label
          const userOwner=owners.find(o=>o.id===user.ownerId);
          summaryTitle.textContent="Count — "+(userOwner?userOwner.name:user.username);
        } else {
          summaryTitle.textContent=selectedOwner?"Count — "+selectedOwner.name:"Count — All Inventories";
        }
        summaryCard.appendChild(summaryTitle);
        const grid=document.createElement("div");
        grid.style.cssText="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;";
        itemTypes.forEach(function(t){
          if(counts[t]){
            const chip=document.createElement("div");
            chip.style.cssText="background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px 10px;text-align:center;";
            chip.innerHTML="<div style='color:#38bdf8;font-weight:700;font-size:18px'>"+counts[t]+"</div><div style='color:#64748b;font-size:11px;margin-top:2px'>"+t+"</div>";
            grid.appendChild(chip);
          }
        });
        summaryCard.appendChild(grid);
        content.appendChild(summaryCard);
      }
    }
    // Show transit items if admin
    const transitItems=items.filter(i=>i.status==="transit");
    if(isAdmin&&transitItems.length>0){
      const tCard=document.createElement("div");
      tCard.style.cssText="background:#431407;border:1px solid #78350f;border-radius:10px;padding:14px;margin-bottom:12px;";
      tCard.innerHTML="<p style='color:#fcd34d;font-weight:700;font-size:13px;margin:0 0 8px'>🚚 In Transit ("+transitItems.length+")</p>"
        +transitItems.map(i=>"<p style='color:#fbbf24;font-size:12px;margin:2px 0'>• "+i.name+" — "+i.barcode+"</p>").join("");
      content.appendChild(tCard);
    }
    if(displayItems.length===0)content.appendChild(el("p",{style:{color:"#334155",textAlign:"center",fontSize:"13px",marginTop:"30px"}},"No active items"));

    // Show viewable inventories for non-admin users (read-only)
    if(!isAdmin){
      const viewableOwners=S.users.find(u=>u.username===user.username)?.viewableOwners||[];
      if(viewableOwners.length>0){
        const divider=document.createElement("div");
        divider.style.cssText="margin:20px 0 12px;border-top:1px solid #1e293b;padding-top:16px;";
        divider.innerHTML="<p style='color:#475569;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin:0 0 12px'>Viewable Inventories</p>";
        content.appendChild(divider);

        viewableOwners.forEach(function(ownerId){
          const viewOwner=owners.find(o=>o.id===ownerId);
          if(!viewOwner) return;

          const ownerItems=items.filter(i=>i.ownerId===ownerId&&i.status==="active");
          const ownerSection=document.createElement("div");
          ownerSection.style.cssText="margin-bottom:16px;";

          const ownerTitle=document.createElement("p");
          ownerTitle.style.cssText="color:#64748b;font-size:12px;font-weight:600;margin:0 0 8px;";
          const icon=viewOwner.type==="person"?"👤":"🗄";
          ownerTitle.textContent=icon+" "+viewOwner.name+" ("+ownerItems.length+" items)";
          ownerSection.appendChild(ownerTitle);

          if(ownerItems.length===0){
            const empty=document.createElement("p");
            empty.style.cssText="color:#334155;font-size:12px;margin:0;";
            empty.textContent="No active items";
            ownerSection.appendChild(empty);
          } else {
            // Show count per item type like the main inventory summary
            const itemTypes=(S.customItemNames||[]);
            const counts={};
            ownerItems.forEach(function(item){
              const key=itemTypes.includes(item.name)?item.name:item.type||"Other";
              counts[key]=(counts[key]||0)+1;
            });
            const countCard=document.createElement("div");
            countCard.style.cssText="background:#0f172a;border-radius:10px;border:1px solid #1e293b;padding:12px 14px;";
            const countGrid=document.createElement("div");
            countGrid.style.cssText="display:flex;flex-wrap:wrap;gap:8px;";
            Object.entries(counts).forEach(function([name,count]){
              const pill=document.createElement("div");
              pill.style.cssText="background:#111827;border:1px solid #1e293b;border-radius:8px;padding:6px 12px;";
              pill.innerHTML="<span style='color:#94a3b8;font-size:11px;font-weight:600'>"+name+"</span>"
                +"<span style='color:#f1f5f9;font-weight:700;font-size:15px;display:block;text-align:center'>"+count+"</span>";
              countGrid.appendChild(pill);
            });
            countCard.appendChild(countGrid);
            ownerSection.appendChild(countCard);
          }
          content.appendChild(ownerSection);
        });
      }
    }
    displayItems.forEach(item=>{
      const isExp=item.expDate&&new Date(item.expDate)<new Date();
      const days=item.expDate?Math.ceil((new Date(item.expDate)-Date.now())/86400000):null;
      const soon=days!==null&&days>=0&&days<=120;
      const card=el("div",{style:{background:"#111827",borderRadius:"10px",padding:"12px 14px",marginBottom:"8px",border:`1px solid ${isExp?"#7f1d1d":soon?"#78350f":"#1e293b"}`}});
      const badge=isExp?`<span class="badge" style="background:#7f1d1d;color:#fca5a5">EXPIRED</span>`:soon?`<span class="badge" style="background:#78350f;color:#fcd34d">${days}d LEFT</span>`:`<span class="badge" style="background:#14532d;color:#86efac">OK</span>`;
      card.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-weight:700;color:#f1f5f9;font-size:14px">${item.name}</div><div style="color:#64748b;font-size:11px;margin-top:2px;font-family:monospace">${item.barcode} · ${item.type}</div></div>${badge}</div><div style="display:flex;gap:12px;margin-top:6px"><span style="color:#64748b;font-size:11px">Exp: ${item.expDate||"—"}</span>${isAdmin?`<span style="color:#64748b;font-size:11px">Owner: ${owners.find(o=>o.id===item.ownerId)?.name||item.ownerId}</span>`:""}</div>`;
      // History button
      const histBtn=document.createElement("button");
      histBtn.textContent="📋 History";
      histBtn.style.cssText="margin-top:8px;padding:5px 10px;border-radius:7px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;margin-right:6px;";
      histBtn.onclick=function(e){e.stopPropagation();setState({modal:{type:"item_history",item:item}});};
      card.appendChild(histBtn);
      // Admin manual checkout button for disposable items
      if(isAdmin&&item.type!=="Capital Equipment"){
        const adminCoBtn=document.createElement("button");
        adminCoBtn.textContent="📤 Check Out";
        adminCoBtn.style.cssText="margin-top:8px;padding:5px 10px;border-radius:7px;border:1px solid #f59e0b33;background:#f59e0b18;color:#fbbf24;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;margin-left:6px;";
        adminCoBtn.onclick=function(e){e.stopPropagation();setState({modal:{type:"admin_checkout",item:item}});};
        card.appendChild(adminCoBtn);
      }
      // Show note button for capital equipment
      if(item.type==="Capital Equipment"&&item.note){
        const noteBtn=document.createElement("button");
        noteBtn.textContent="📝 Note";
        noteBtn.style.cssText="margin-top:8px;padding:5px 10px;border-radius:7px;border:1px solid #6366f133;background:#6366f118;color:#818cf8;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;";
        noteBtn.onclick=function(e){e.stopPropagation();setState({modal:{type:"view_note",item:item}});};
        card.appendChild(noteBtn);
      }
      content.appendChild(card);
    });
  }

  // USED INVENTORY
  if(tab==="used"){
    content.appendChild(el("p",{style:{color:"#475569",fontSize:"12px",fontWeight:"600",margin:"0 0 12px",textTransform:"uppercase",letterSpacing:".07em"}},isAdmin?"All Used Items":"Your Used Items"));
    if(visUsedItems.length===0)content.appendChild(el("p",{style:{color:"#334155",textAlign:"center",fontSize:"13px",marginTop:"30px"}},"No used items yet"));
    visUsedItems.forEach(item=>{
      const card=el("div",{style:{background:"#111827",borderRadius:"10px",padding:"12px 14px",marginBottom:"8px",border:"1px solid #374151"}});
      card.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-weight:700;color:#9ca3af;font-size:14px">${item.name}</div><div style="color:#64748b;font-size:11px;margin-top:2px;font-family:monospace">${item.barcode} · ${item.type}</div></div><span class="badge" style="background:#374151;color:#9ca3af">USED</span></div><div style="display:flex;gap:12px;margin-top:6px">${item.expDate?`<span style="color:#64748b;font-size:11px">Exp: ${item.expDate}</span>`:""}${isAdmin?`<span style="color:#64748b;font-size:11px">Used by: ${item.usedBy||"—"}</span>`:""}</div>`;
      if(isAdmin){
        card.style.cursor="pointer";
        card.onclick=function(){setState({modal:{type:"undo_checkout",item:item}});};
      }
      content.appendChild(card);
    });
  }

  // ORDERS
  if(tab==="orders"){
    // Order QR creation handled via the Order button in the action bar
    if(orders.length===0)content.appendChild(el("p",{style:{color:"#334155",textAlign:"center",fontSize:"13px",marginTop:"20px"}},"No orders yet"));
    orders.forEach(order=>{
      const card=el("div",{class:"card"});
      const statusColors={"transit":"#fbbf24","received":"#86efac","open":"#38bdf8"};
      const statusBgs={"transit":"#78350f","received":"#14532d","open":"#0f172a"};
      const st=order.status||"open";
      const barcodes=(order.items||"").split(",").filter(b=>b.trim());
      card.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-weight:700;color:#f1f5f9;font-size:14px">${order.name||order.id}</div><div style="color:#64748b;font-size:11px;font-family:monospace;margin-top:2px">${order.id}</div><div style="color:#64748b;font-size:11px;margin-top:2px">Items: ${barcodes.length} · By: ${order.createdBy}</div></div><span class="badge" style="background:${statusBgs[st]||"#1e293b"};color:${statusColors[st]||"#64748b"}">${st.toUpperCase()}</span></div><div style="color:#64748b;font-size:11px;margin-top:6px">${order.createdAt?formatDate(order.createdAt):""}</div>`;
      content.appendChild(card);
    });
  }

  // TRAYS & CAPITAL TAB
  if(tab==="capital"){
    const capitalItems=items.filter(i=>i.type==="Capital Equipment");
    const facilities=S.facilities||[];

    // Admin: Add Facility button
    if(isAdmin){
      const addFacBtn=document.createElement("button");
      addFacBtn.textContent="+ Add Facility";
      addFacBtn.style.cssText="padding:8px 16px;border-radius:8px;border:1px solid #6366f133;background:#6366f118;color:#818cf8;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:16px;";
      addFacBtn.onclick=function(){setState({modal:{type:"add_facility"}});};
      content.appendChild(addFacBtn);
    }

    // Personal Capital section
    const myCapital=isAdmin?capitalItems.filter(i=>i.status==="active"&&!facilities.find(f=>f.id===i.ownerId)):capitalItems.filter(i=>i.ownerId===user.ownerId&&i.status==="active");
    const personalTitle=document.createElement("p");
    personalTitle.style.cssText="color:#475569;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin:0 0 10px;";
    personalTitle.textContent=isAdmin?"Active Capital Equipment":"Your Capital Equipment";
    content.appendChild(personalTitle);

    if(myCapital.length===0){
      content.appendChild(el("p",{style:{color:"#334155",fontSize:"13px",marginBottom:"16px"}},"No capital equipment"));
    } else {
      myCapital.forEach(function(item){
        const card=el("div",{class:"card"});
        const ownerName=owners.find(o=>o.id===item.ownerId)?.name||item.ownerId;
        card.innerHTML="<div style='display:flex;justify-content:space-between;align-items:flex-start'>"
          +"<div><div style='font-weight:700;color:#f1f5f9;font-size:14px'>"+item.name+"</div>"
          +"<div style='color:#64748b;font-size:11px;font-family:monospace;margin-top:2px'>"+item.barcode+"</div></div>"
          +"<span class='badge' style='background:#0ea5e918;color:#38bdf8'>CAPITAL</span></div>"
          +"<div style='color:#64748b;font-size:11px;margin-top:6px'>"+(isAdmin?"Owner: "+ownerName:"")+"</div>"
          +(item.note?"<div style='margin-top:8px;padding:8px 10px;background:#0f172a;border-radius:8px;border-left:3px solid #6366f1;color:#94a3b8;font-size:12px;line-height:1.6'>📝 "+renderNoteHTML(item.note)+"</div>":"");
        if(isAdmin){
          const editNoteBtn=document.createElement("button");
          editNoteBtn.textContent=item.note?"✏️ Edit Note":"+ Add Note";
          editNoteBtn.style.cssText="margin-top:8px;padding:5px 10px;border-radius:7px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;";
          editNoteBtn.onclick=function(e){e.stopPropagation();setState({modal:{type:"edit_note",item:item}});};
          card.appendChild(editNoteBtn);
        }
        content.appendChild(card);
      });
    }

    // Facilities section
    const facTitle=document.createElement("p");
    facTitle.style.cssText="color:#475569;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin:16px 0 10px;border-top:1px solid #1e293b;padding-top:16px;";
    facTitle.textContent="Facilities";
    content.appendChild(facTitle);

    if(facilities.length===0){
      content.appendChild(el("p",{style:{color:"#334155",fontSize:"13px"}},"No facilities added yet"+(isAdmin?" — tap '+ Add Facility' above":"")));
    } else {
      facilities.forEach(function(facility){
        const facItems=capitalItems.filter(i=>i.ownerId===facility.id);
        const facCard=el("div",{class:"card"});
        facCard.style.cssText+="border-left:3px solid #6366f1;";

        const facHdr=document.createElement("div");
        facHdr.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;";
        facHdr.innerHTML="<div style='font-weight:700;color:#f1f5f9;font-size:14px'>🏥 "+facility.name+"</div>"
          +"<span style='color:#818cf8;font-size:12px;font-weight:600'>"+facItems.length+" item"+(facItems.length!==1?"s":"")+"</span>";
        facCard.appendChild(facHdr);

        if(facItems.length===0){
          const empty=document.createElement("p");
          empty.style.cssText="color:#334155;font-size:12px;margin:0;";
          empty.textContent="No capital equipment here";
          facCard.appendChild(empty);
        } else {
          facItems.forEach(function(item){
            const row=document.createElement("div");
            row.style.cssText="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1e293b;";
            row.innerHTML="<span style='color:#f1f5f9;font-size:13px'>"+item.name+"</span>"
              +"<span style='color:#64748b;font-size:11px;font-family:monospace'>"+item.barcode+"</span>";
            facCard.appendChild(row);
          });
        }

        // Admin: delete facility button
        if(isAdmin){
          const delBtn=document.createElement("button");
          delBtn.textContent="Delete Facility";
          delBtn.style.cssText="margin-top:10px;padding:5px 10px;border-radius:6px;border:1px solid #dc262633;background:transparent;color:#f87171;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;";
          delBtn.onclick=function(){
            if(confirm("Delete facility '"+facility.name+"'? Items here will need to be transferred out first.")){
              if(facItems.length>0){showToast("Move items out of this facility first","warn");return;}
              window.fsDelete(oc("facilities"),facility.id).then(function(){
                setState({facilities:S.facilities.filter(f=>f.id!==facility.id)});
                showToast("✅ Facility deleted");
              }).catch(function(e){showToast("Failed: "+e.message,"err");});
            }
          };
          facCard.appendChild(delBtn);
        }

        content.appendChild(facCard);
      });
    }
  }

  // USERS (admin only)
  if(tab==="users"&&isAdmin){
    content.appendChild(el("p",{style:{color:"#475569",fontSize:"12px",fontWeight:"600",margin:"0 0 12px",textTransform:"uppercase",letterSpacing:".07em"}},"User Inventory Access"));

    S.users.forEach(function(u){
      if(!u.username) return;
      const isCurrentUser = u.username===user.username;
      const card=document.createElement("div");
      card.style.cssText="background:#111827;border-radius:12px;border:1px solid #1e293b;padding:14px 16px;margin-bottom:10px;";

      const hdr=document.createElement("div");
      hdr.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;";
      const userInfo=document.createElement("div");
      const userOwner=owners.find(o=>o.id===u.ownerId);
      userInfo.innerHTML="<div style='color:#f1f5f9;font-weight:700;font-size:14px'>"+(userOwner?userOwner.name:u.username)+"</div>"
        +"<div style='color:#64748b;font-size:11px'>"+u.username+"</div>"
        +"<div style='color:#64748b;font-size:11px;text-transform:uppercase;margin-top:2px'>"+u.role+"</div>";
      hdr.appendChild(userInfo);

      if(u.role!=="admin"){
        const editBtn=document.createElement("button");
        editBtn.textContent="Edit Access";
        editBtn.style.cssText="padding:6px 12px;border-radius:7px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;";
        editBtn.onclick=function(){setState({modal:{type:"edit_user_access",targetUser:u}});};
        hdr.appendChild(editBtn);
      }
      card.appendChild(hdr);

      // Show current viewable owners
      const viewable=(u.viewableOwners||[]);
      if(viewable.length>0){
        const accessDiv=document.createElement("div");
        accessDiv.style.cssText="display:flex;flex-wrap:wrap;gap:6px;";
        viewable.forEach(function(oid){
          const o=owners.find(x=>x.id===oid);
          if(o){
            const badge=document.createElement("span");
            badge.style.cssText="background:#0ea5e918;border:1px solid #0ea5e933;color:#38bdf8;font-size:11px;padding:3px 8px;border-radius:5px;";
            badge.textContent=(o.type==="person"?"👤":"🗄")+" "+o.name;
            accessDiv.appendChild(badge);
          }
        });
        card.appendChild(accessDiv);
      } else if(u.role!=="admin"){
        const none=document.createElement("div");
        none.style.cssText="color:#334155;font-size:12px;";
        none.textContent="No additional inventory access";
        card.appendChild(none);
      }

      content.appendChild(card);
    });
  }

  // LOG
  if(tab==="log"){
    const displayLog=isAdmin?S.log:S.log.filter(e=>e.user===user.username||e.from===owners.find(o=>o.id===user.ownerId)?.name||e.to===owners.find(o=>o.id===user.ownerId)?.name);
    if(displayLog.length===0)content.appendChild(el("p",{style:{color:"#334155",textAlign:"center",fontSize:"13px",marginTop:"30px"}},"No activity yet"));
    displayLog.forEach((entry,i)=>{
      const colors={CHECK_IN:"#22c55e",CHECK_OUT:"#f59e0b",TRANSFER:"#6366f1"};
      const icons={CHECK_IN:"📥",CHECK_OUT:"📤",TRANSFER:"🔄"};
      const card=el("div",{style:{background:"#111827",borderRadius:"10px",padding:"11px 14px",marginBottom:"7px",border:"1px solid #1e293b",display:"flex",gap:"12px"}});
      card.innerHTML=`<span style="font-size:20px">${icons[entry.action]||"📋"}</span><div style="flex:1"><div style="display:flex;justify-content:space-between"><span style="color:${colors[entry.action]||"#94a3b8"};font-weight:700;font-size:12px">${entry.action?.replace("_"," ")}</span><span style="color:#334155;font-size:11px">${entry.ts?formatDate(entry.ts):""}</span></div><div style="color:#f1f5f9;font-size:13px;margin-top:2px">${entry.itemName}</div><div style="display:flex;gap:10px;margin-top:3px"><span style="color:#64748b;font-size:11px;font-family:monospace">${entry.barcode}</span><span style="color:#475569;font-size:11px">by ${entry.user}</span></div>${entry.action==="TRANSFER"?`<div style="color:#818cf8;font-size:11px;margin-top:2px">${entry.from} → ${entry.to}</div>`:""}${entry.action==="CHECK_OUT"?`<div style="color:#fb923c;font-size:11px;margin-top:2px">from ${entry.from} → Used</div>`:""}${entry.action==="CHECK_IN"&&entry.from?.startsWith("ORD-")?`<div style="color:#818cf8;font-size:11px;margin-top:2px">Order: ${entry.from}</div>`:""}</div>`;
      content.appendChild(card);
    });
  }

  wrap.appendChild(content);
  return wrap;
}

// ── SCANNER OVERLAY ───────────────────────────────────────────────────────────
function renderScanner(){
  const div=el("div",{style:{position:"fixed",inset:"0",background:"rgba(10,15,28,0.98)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:"800",gap:"14px",padding:"20px 16px"}});

  // Show scanned count if in multi-scan mode
  if(S.showMultiScan&&S.multiCodes.length>0){
    const counter=el("div",{style:{background:"#0ea5e918",border:"1px solid #0ea5e933",borderRadius:"10px",padding:"10px 20px",textAlign:"center"}});
    counter.innerHTML=`<span style="color:#38bdf8;font-weight:700;font-size:16px">📦 ${S.multiCodes.length} code${S.multiCodes.length>1?"s":""} scanned</span>`;
    div.appendChild(counter);
  }

  const status=el("p",{id:"scan-status",style:{color:"#7dd3fc",fontSize:"13px",margin:"0",textAlign:"center",fontFamily:"monospace"}},S.showMultiScan?"Scan next code or tap Done":"Starting camera…");
  div.appendChild(status);
  const videoWrap=el("div",{style:{position:"relative",width:"100%",maxWidth:"320px",borderRadius:"16px",overflow:"hidden",border:"2px solid #0ea5e9"}});
  const video=el("video",{id:"scan-video",autoplay:"",playsinline:"",muted:"",style:{width:"100%",display:"block",background:"#000",minHeight:"240px"}});
  const canvas=el("canvas",{id:"scan-canvas",style:{display:"none"}});
  const overlay=el("div",{style:{position:"absolute",inset:"0",display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}});
  const box=el("div",{style:{width:"160px",height:"160px",border:"3px solid #0ea5e9",borderRadius:"12px",boxShadow:"0 0 0 9999px rgba(0,0,0,0.5)"}});
  overlay.appendChild(box);videoWrap.appendChild(video);videoWrap.appendChild(canvas);videoWrap.appendChild(overlay);
  div.appendChild(videoWrap);



  // Done button for order item scanning
  if(S.showOrderItemScan){
    const countBadge=document.createElement("div");
    countBadge.style.cssText="background:#6366f118;border:1px solid #6366f133;border-radius:10px;padding:8px 16px;text-align:center;width:100%;max-width:320px;";
    countBadge.innerHTML="<span style='color:#818cf8;font-weight:700;font-size:15px'>🗃 "+S.orderItems.length+" item"+(S.orderItems.length!==1?"s":"")+" added to order</span>";
    div.appendChild(countBadge);
    const doneBtn=el("button",{class:"btn btn-green",style:{maxWidth:"320px",marginTop:"4px"}},"Done Adding Items → Scan Order QR");
    doneBtn.onclick=()=>{
      if(S.orderItems.length===0){showToast("Scan at least one item","warn");return;}
      stopScanner();
      setState({scanning:true,showOrderItemScan:false,showOrderQRScan:true,scanHint:"Scan the Order QR code to finalize"});
    };
    div.appendChild(doneBtn);
  }

  // Done button for multi-scan
  if(S.showMultiScan){
    const doneBtn=el("button",{class:"btn btn-green",style:{maxWidth:"320px",marginTop:"4px"}},`Done Scanning (${S.multiCodes.length} codes)`);
    doneBtn.onclick=()=>{stopScanner();setState({scanning:false,showMultiScan:false,showMultiConfirm:true});};
    div.appendChild(doneBtn);
  }

  const cancelBtn=el("button",{style:{padding:"12px 32px",borderRadius:"9px",background:"transparent",color:"#94a3b8",border:"1px solid #334155",fontSize:"14px",width:"100%",maxWidth:"320px"}},"Cancel");
  cancelBtn.onclick=()=>{stopScanner();setState({scanning:false,scanMode:null,multiMode:false,showMultiScan:false,multiCodes:[],multiDetails:null});};
  div.appendChild(cancelBtn);
  return div;
}

// ── SCAN MODE PROMPT ──────────────────────────────────────────────────────────
function renderScanPrompt(){
  const div=el("div",{class:"overlay-center"});
  const card=el("div",{style:{width:"100%",maxWidth:"360px",background:"#111827",borderRadius:"20px",padding:"24px",border:"1px solid #1e293b"}});
  card.innerHTML=`<h2 style="color:#f1f5f9;font-size:18px;font-weight:700;margin:0 0 6px;text-align:center">How many items?</h2><p style="color:#64748b;font-size:13px;text-align:center;margin:0 0 20px">Choose check-in mode</p>`;
  [
    ["single","1️⃣","Single Item","Scan one item","#22c55e"],
    ["multi","📦","Multiple Items","Enter details once, scan all codes","#0ea5e9"],
  ].forEach(([mode,icon,label,sub,color])=>{
    const btn=el("button",{style:{width:"100%",padding:"14px 16px",borderRadius:"12px",border:`1px solid ${color}33`,background:`${color}18`,color,fontWeight:"700",fontSize:"15px",display:"flex",alignItems:"center",gap:"12px",marginBottom:"10px",textAlign:"left"}});
    btn.innerHTML=`<span style="font-size:26px">${icon}</span><div><div>${label}</div><div style="font-size:11px;font-weight:400;opacity:.7;margin-top:2px">${sub}</div></div>`;
    btn.onclick=()=>{
      setState({showScanPrompt:false});
      if(mode==="single")setState({multiMode:false,scanning:true,scanHint:"Point camera at QR code"});
      else if(mode==="multi")setState({multiMode:true,multiCodes:[],multiDetails:null,showMultiDetails:true});
    };
    card.appendChild(btn);
  });
  const cancelBtn=el("button",{style:{width:"100%",padding:"12px",borderRadius:"9px",border:"1px solid #334155",background:"transparent",color:"#64748b",fontSize:"14px"}},"Cancel");
  cancelBtn.onclick=()=>setState({showScanPrompt:false});
  card.appendChild(cancelBtn);div.appendChild(card);return div;
}

// ── MULTI STEP 1: ENTER DETAILS ───────────────────────────────────────────────
function renderMultiDetails(){
  let name="",type="",expDate="";
  const div=el("div",{class:"overlay"});
  const inner=el("div",{class:"overlay-inner"});
  const titleRow=el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}});
  titleRow.innerHTML=`<h2 style="color:#f1f5f9;font-size:18px;font-weight:700;margin:0">Item Details</h2>`;
  const closeBtn=el("button",{style:{background:"none",border:"none",color:"#475569",fontSize:"24px",cursor:"pointer"}},"✕");
  closeBtn.onclick=()=>setState({showMultiDetails:false,multiMode:false,multiCodes:[],scanMode:null});
  titleRow.appendChild(closeBtn);inner.appendChild(titleRow);
  inner.appendChild(el("p",{style:{color:"#64748b",fontSize:"13px",margin:"0 0 20px"}},"Enter details once — they'll apply to all scanned items."));
  // Item Name dropdown
  const ln1=el("label",{class:"label"},"Item Name");
  const sn1=el("select");
  sn1.appendChild(el("option",{value:""},"Select item…"));
  (S.customItemNames||[]).forEach(function(n){
    sn1.appendChild(el("option",{value:n},n));
  });
  if(S.user&&S.user.role==="admin"){
    sn1.appendChild(el("option",{value:"__add_new__"},"+ Add New Item Name"));
  }
  sn1.onchange=function(){
    if(this.value==="__add_new__"){
      this.value="";
      setState({modal:{type:"add_item_name",returnTo:"checkin",barcode:modal.barcode}});
    } else {
      name=this.value;
    }
  };
  inner.appendChild(ln1);inner.appendChild(sn1);inner.appendChild(el("div",{style:{height:"14px"}}));

  // Equipment Type dropdown
  const ln2=el("label",{class:"label"},"Equipment Type");
  const sn2=el("select");
  sn2.appendChild(el("option",{value:""},"Select type…"));
  ["Disposable","Capital Equipment"].forEach(function(t){sn2.appendChild(el("option",{value:t},t));});
  sn2.onchange=function(){
    type=this.value;
    const noteSection=document.getElementById("capital-note-section");

function renderOrderGen(){

  closeBtn.onclick=()=>{setState({showOrderGen:false});loadData();};
  titleRow.appendChild(closeBtn);inner.appendChild(titleRow);
  let orderName="",assignTo="";
  const nameLabel=el("label",{class:"label"},"Order Name");
  const nameInput=el("input",{type:"text",placeholder:"e.g. Shipment Jan 2026"});
  nameInput.oninput=e=>orderName=e.target.value;
  inner.appendChild(nameLabel);inner.appendChild(nameInput);inner.appendChild(el("div",{style:{height:"16px"}}));
  const assignLabel=el("label",{class:"label"},"Assign Items To");
  const assignSelect=el("select");
  assignSelect.appendChild(el("option",{value:""},"Select owner…"));
  S.owners.forEach(o=>{const icon=o.id.toUpperCase()==="POOL"?"🏪":o.id==="USED"?"🗑":o.type==="locker"?"🗄":"👤";assignSelect.appendChild(el("option",{value:o.id},`${icon} ${o.name}`));});
  assignSelect.onchange=e=>assignTo=e.target.value;

  const qrDiv=el("div",{id:"order-qr-result",style:{display:"none",textAlign:"center"}});
  inner.appendChild(qrDiv);
  const genBtn=el("button",{class:"btn btn-purple"},"Generate Order QR →");
  genBtn.onclick=async()=>{
    if(!orderName||!assignTo){showToast("Fill in all fields","warn");return;}
    genBtn.textContent="Creating…";genBtn.disabled=true;
    const orderId=`ORD-${Date.now()}`;
    const now=new Date().toISOString();
    try{
      await addOrder({id:orderId,name:orderName,count:0,createdBy:S.user.username,createdAt:now,status:"open",items:""});
      qrDiv.style.display="block";
      qrDiv.innerHTML=`<p style="color:#4ade80;font-weight:700;margin:0 0 4px">✅ Order Created!</p><p style="color:#94a3b8;font-size:13px;margin:0 0 16px">${orderName}</p><div id="oqr" style="display:inline-block;background:#fff;padding:12px;border-radius:10px;margin-bottom:12px"></div><p style="color:#64748b;font-size:11px;font-family:monospace;margin:0 0 16px">${orderId}</p>`;
      if(window.QRCode)new window.QRCode(document.getElementById("oqr"),{text:orderId,width:160,height:160});
      const printBtn=el("button",{class:"btn btn-primary",style:{marginBottom:"10px"}},"🖨 Print QR Code");
      printBtn.onclick=()=>{
        const pa=document.getElementById("print-area");
        pa.style.display="block";
        pa.innerHTML=`<h2 style="font-family:sans-serif">${orderName}</h2><div>${document.getElementById("oqr").innerHTML}</div><p style="font-family:monospace;font-size:12px">${orderId}</p>`;
        window.print();pa.style.display="none";
      };
      qrDiv.appendChild(printBtn);genBtn.style.display="none";showToast("Order created!");
    }catch(e){showToast("Failed to create order","err");genBtn.textContent="Generate Order QR →";genBtn.disabled=false;}
  };
  inner.appendChild(genBtn);div.appendChild(inner);return div;
}
