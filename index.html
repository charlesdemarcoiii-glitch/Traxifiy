    const div2=el("div",{class:"overlay"});
    const inner2=el("div",{class:"overlay-inner"});

    const titleRow=document.createElement("div");
    titleRow.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;";
    const title=document.createElement("h2");
    title.style.cssText="color:#f1f5f9;font-size:18px;font-weight:700;margin:0;";
    title.textContent="Add Facility";
    const xBtn=document.createElement("button");
    xBtn.style.cssText="background:none;border:none;color:#475569;font-size:24px;cursor:pointer;";
    xBtn.textContent="✕";
    xBtn.onclick=function(){setState({modal:null});};
    titleRow.appendChild(title);titleRow.appendChild(xBtn);
    inner2.appendChild(titleRow);

    const note=document.createElement("p");
    note.style.cssText="color:#64748b;font-size:13px;margin-bottom:16px;";
    note.textContent='Name will be prefixed with "Facility - " automatically';
    inner2.appendChild(note);

    const label=document.createElement("label");
    label.style.cssText="color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;";
    label.textContent="Facility Name";
    inner2.appendChild(label);

    const preview=document.createElement("div");
    preview.style.cssText="color:#818cf8;font-size:13px;font-weight:600;margin-bottom:8px;min-height:20px;";
    preview.textContent="";

    const input=document.createElement("input");
    input.type="text";
    input.placeholder='e.g. OR Suite 1, Room 204';
    input.style.cssText="width:100%;box-sizing:border-box;margin-bottom:8px;";
    input.oninput=function(){
      facilityName=this.value.trim();
      preview.textContent=facilityName?"Preview: Facility - "+facilityName:"";
    };
    input.onkeydown=function(e){if(e.key==="Enter")saveFacility();};
    inner2.appendChild(input);
    inner2.appendChild(preview);

    const saveBtn=document.createElement("button");
    saveBtn.style.cssText="width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;font-weight:700;font-size:16px;cursor:pointer;display:block;font-family:inherit;margin-top:12px;margin-bottom:10px;";
    saveBtn.textContent="✓ Add Facility";
    saveBtn.onclick=saveFacility;
    inner2.appendChild(saveBtn);

    const cancelBtn=document.createElement("button");
    cancelBtn.textContent="Cancel";
    cancelBtn.style.cssText="width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:600;font-size:15px;cursor:pointer;display:block;font-family:inherit;";
    cancelBtn.onclick=function(){setState({modal:null});};
    inner2.appendChild(cancelBtn);

    function saveFacility(){
      if(!facilityName){showToast("Enter a facility name","warn");return;}
      const fullName="Facility - "+facilityName;
      const id="FAC-"+Date.now();
      addFacility({id,name:fullName}).then(function(){
        setState({facilities:[...S.facilities,{id,name:fullName}],modal:null});
        showToast("✅ "+fullName+" added");
      }).catch(function(e){showToast("Failed: "+e.message,"err");});
    }

    div2.appendChild(inner2);
    return div2;
  }

  if(modal.type==="facility_checkout"){
    const item=modal.item;
    const facilities=S.facilities||[];

    const page=document.createElement("div");
    page.style.cssText="position:fixed;inset:0;background:#0a0f1c;z-index:1000;overflow-y:auto;-webkit-overflow-scrolling:touch;";
    const inner2=document.createElement("div");
    inner2.style.cssText="max-width:480px;margin:0 auto;padding:24px 20px;";

    const hdr=document.createElement("div");
    hdr.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-top:8px;";
    const title=document.createElement("div");
    title.innerHTML="<div style='color:#f1f5f9;font-size:18px;font-weight:700'>Transfer Capital Equipment</div>"
      +"<div style='color:#64748b;font-size:12px;margin-top:2px'>"+item.name+" · "+item.barcode+"</div>";
    const xBtn=document.createElement("button");
    xBtn.style.cssText="background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:18px;border-radius:8px;padding:8px 12px;cursor:pointer;font-family:inherit;";
    xBtn.textContent="✕";
    xBtn.onclick=function(){setState({modal:null});};
    hdr.appendChild(title);hdr.appendChild(xBtn);
    inner2.appendChild(hdr);

    const question=document.createElement("p");
    question.style.cssText="color:#94a3b8;font-size:14px;margin-bottom:16px;";
    question.textContent="Which facility are you transferring this capital equipment to?";
    inner2.appendChild(question);

    if(facilities.length===0){
      const empty=document.createElement("p");
      empty.style.cssText="color:#f87171;font-size:13px;text-align:center;padding:20px 0;";
      empty.textContent="No facilities added yet. Ask admin to add a facility first.";
      inner2.appendChild(empty);
    } else {
      facilities.forEach(function(facility){
        const btn=document.createElement("button");
        btn.style.cssText="width:100%;padding:14px 16px;border-radius:10px;border:1px solid #6366f133;background:#6366f118;color:#c084fc;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:8px;text-align:left;display:flex;align-items:center;gap:10px;";
        btn.innerHTML="<span style='font-size:18px'>🏥</span><span>"+facility.name+"</span>";
        btn.onclick=function(){
          setState({modal:null});
          submitFacilityCheckout(item, facility);
        };
        inner2.appendChild(btn);
      });
    }

    const cancelBtn=document.createElement("button");
    cancelBtn.textContent="Cancel";
    cancelBtn.style.cssText="width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:600;font-size:15px;cursor:pointer;display:block;font-family:inherit;margin-top:8px;";
    cancelBtn.onclick=function(){setState({modal:null});};
    inner2.appendChild(cancelBtn);

    page.appendChild(inner2);
    return page;
  }

  if(modal.type==="undo_checkout"){
    const item=modal.item;
    const div2=el("div",{class:"overlay"});
    const inner2=el("div",{class:"overlay-inner"});

    const titleRow=document.createElement("div");
    titleRow.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;";
    const title=document.createElement("h2");
    title.style.cssText="color:#f1f5f9;font-size:18px;font-weight:700;margin:0;";
    title.textContent="Un-Check Out Item?";
    const xBtn=document.createElement("button");
    xBtn.style.cssText="background:none;border:none;color:#475569;font-size:24px;cursor:pointer;";
    xBtn.textContent="✕";
    xBtn.onclick=function(){setState({modal:null});};
    titleRow.appendChild(title);titleRow.appendChild(xBtn);
    inner2.appendChild(titleRow);

    // Item info card
    const infoCard=document.createElement("div");
    infoCard.style.cssText="background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:16px;margin-bottom:20px;";
    infoCard.innerHTML="<div style='color:#f1f5f9;font-weight:700;font-size:15px;margin-bottom:4px'>"+item.name+"</div>"
      +"<div style='color:#64748b;font-size:12px;font-family:monospace;margin-bottom:4px'>"+item.barcode+"</div>"
      +"<div style='color:#64748b;font-size:12px'>Used by: "+(item.usedBy||"—")+"</div>";
    inner2.appendChild(infoCard);

    // Find previous location from log
    const itemLog2=S.log.filter(l=>l.barcode===item.barcode);
    const checkoutEntry2=itemLog2.find(l=>l.action==="CHECK_OUT");
    let prevLocation="Unclaimed Inventory";
    if(checkoutEntry2&&checkoutEntry2.from){
      const fromVal2=checkoutEntry2.from.trim().toLowerCase();
      const matchedOwner=S.owners.find(o=>o.name.trim().toLowerCase()===fromVal2||o.id.trim().toLowerCase()===fromVal2);
      prevLocation=matchedOwner?matchedOwner.name:checkoutEntry2.from;
    }

    // Question
    const question=document.createElement("p");
    question.style.cssText="color:#94a3b8;font-size:14px;text-align:center;margin-bottom:20px;";
    question.textContent="This will move the item back to: "+prevLocation;
    inner2.appendChild(question);

    const confirmBtn=document.createElement("button");
    confirmBtn.textContent="✓ Yes, Un-Check Out";
    confirmBtn.style.cssText="width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;font-weight:700;font-size:16px;cursor:pointer;display:block;font-family:inherit;margin-bottom:10px;";
    confirmBtn.onclick=function(){setState({modal:null});submitUndoCheckout(item);};
    inner2.appendChild(confirmBtn);

    const cancelBtn=document.createElement("button");
    cancelBtn.textContent="Cancel";
    cancelBtn.style.cssText="width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-weight:600;font-size:15px;cursor:pointer;display:block;font-family:inherit;";
    cancelBtn.onclick=function(){setState({modal:null});};
    inner2.appendChild(cancelBtn);

    div2.appendChild(inner2);
    return div2;
  }

  if(modal.type==="item_history"){
    const item=modal.item;
    const itemLog=S.log.filter(l=>l.barcode===item.barcode);

    const page=document.createElement("div");
    page.style.cssText="position:fixed;inset:0;background:#0a0f1c;z-index:1000;overflow-y:auto;-webkit-overflow-scrolling:touch;";
    const inner2=document.createElement("div");
    inner2.style.cssText="max-width:480px;margin:0 auto;padding:24px 20px;";

    // Header
    const hdr=document.createElement("div");
    hdr.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-top:8px;";
    const title=document.createElement("div");
    title.innerHTML="<div style='color:#f1f5f9;font-size:18px;font-weight:700'>"+item.name+"</div><div style='color:#64748b;font-size:12px;font-family:monospace'>"+item.barcode+"</div>";
    const xBtn=document.createElement("button");
    xBtn.style.cssText="background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:18px;border-radius:8px;padding:8px 12px;cursor:pointer;font-family:inherit;";
    xBtn.textContent="✕";
    xBtn.onclick=function(){setState({modal:null});};
    hdr.appendChild(title);hdr.appendChild(xBtn);
    inner2.appendChild(hdr);

    // Current status card
    const statusCard=document.createElement("div");
    statusCard.style.cssText="background:#111827;border:1px solid #1e293b;border-radius:12px;padding:14px 16px;margin-bottom:16px;";
    const ownerName=S.owners.find(o=>o.id===item.ownerId)?.name||item.ownerId;
    statusCard.innerHTML="<div style='color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px'>Current Status</div>"
      +"<div style='display:flex;gap:16px;flex-wrap:wrap'>"
      +"<div><div style='color:#64748b;font-size:11px'>Location</div><div style='color:#f1f5f9;font-weight:600;font-size:13px'>"+ownerName+"</div></div>"
      +"<div><div style='color:#64748b;font-size:11px'>Status</div><div style='color:#f1f5f9;font-weight:600;font-size:13px'>"+item.status+"</div></div>"
      +"<div><div style='color:#64748b;font-size:11px'>Expires</div><div style='color:#f1f5f9;font-weight:600;font-size:13px'>"+(item.expDate?item.expDate.substring(0,10):"—")+"</div></div>"
      +"</div>";
    inner2.appendChild(statusCard);

    // History log
    const histTitle=document.createElement("div");
    histTitle.style.cssText="color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;";
    histTitle.textContent="Activity History ("+itemLog.length+" events)";
    inner2.appendChild(histTitle);

    if(itemLog.length===0){
      const empty=document.createElement("div");
      empty.style.cssText="color:#334155;font-size:13px;text-align:center;padding:24px 0;";
      empty.textContent="No activity recorded yet";
      inner2.appendChild(empty);
    } else {
      const actionColors={CHECK_IN:"#22c55e",CHECK_OUT:"#f59e0b",TRANSFER:"#6366f1",ORDER_IN:"#0ea5e9",ORDER_OUT:"#a855f7"};
      const actionIcons={CHECK_IN:"📥",CHECK_OUT:"📤",TRANSFER:"🔄",ORDER_IN:"📦",ORDER_OUT:"🚚"};
      itemLog.forEach(function(entry){
        const row=document.createElement("div");
        row.style.cssText="background:#111827;border:1px solid #1e293b;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;";
        const icon=document.createElement("span");
        icon.style.cssText="font-size:18px;margin-top:2px;";
        icon.textContent=actionIcons[entry.action]||"📋";
        const info=document.createElement("div");
        info.style.cssText="flex:1;";
        const actionColor=actionColors[entry.action]||"#94a3b8";
        const actionLabel=(entry.action||"").replace(/_/g," ");
        let detail="";
        if(entry.from&&entry.to)detail=entry.from+" → "+entry.to;
        else if(entry.to)detail="→ "+entry.to;
        else if(entry.from)detail="from "+entry.from;
        info.innerHTML="<div style='display:flex;justify-content:space-between;align-items:center'>"
          +"<span style='color:"+actionColor+";font-weight:700;font-size:12px'>"+actionLabel+"</span>"
          +"<span style='color:#475569;font-size:10px'>"+formatDate(entry.ts)+"</span>"
          +"</div>"
          +(detail?"<div style='color:#94a3b8;font-size:12px;margin-top:3px'>"+detail+"</div>":"")
          +"<div style='color:#475569;font-size:11px;margin-top:2px'>by "+entry.user+"</div>";
        row.appendChild(icon);row.appendChild(info);
        inner2.appendChild(row);
      });
    }

    page.appendChild(inner2);
    return page;
  }

  div.appendChild(inner);return div;
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function renderToast(){
  const {toast}=S;
  const bg=toast.type==="err"?"#7f1d1d":toast.type==="warn"?"#78350f":"#14532d";
  return el("div",{class:"toast",style:{background:bg}},toast.msg);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
// Unregister any cached service workers
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(reg=>reg.unregister());
  });
}
// Render login screen immediately, load data only after Firebase + login
render();
fsWaitForReady().then(()=>{ loadData(); });
// Background sync every 60 seconds
setInterval(()=>{ if(S.user&&!S.loading) loadData(); }, 60000);

// Service worker disabled

// ── PWA INSTALL PROMPT ─────────────────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner() {
  if(document.getElementById('install-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#111827;border-top:1px solid #1e293b;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;z-index:9999;';
  banner.innerHTML = '<div><div style="color:#f1f5f9;font-weight:700;font-size:14px">Install Traxify</div><div style="color:#64748b;font-size:12px">Add to your home screen</div></div>';
  const btns = document.createElement('div');
  btns.style.cssText = 'display:flex;gap:8px;';
  const installBtn = document.createElement('button');
  installBtn.textContent = 'Install';
  installBtn.style.cssText = 'background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;';
  installBtn.onclick = () => { if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; banner.remove(); }); } };
  const dismissBtn = document.createElement('button');
  dismissBtn.textContent = 'Later';
  dismissBtn.style.cssText = 'background:transparent;color:#64748b;border:1px solid #334155;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;';
  dismissBtn.onclick = () => banner.remove();
  btns.appendChild(installBtn); btns.appendChild(dismissBtn);
  banner.appendChild(btns);
  document.body.appendChild(banner);
}

// Stop camera when user switches tabs or minimizes the app
// pagehide is more reliable than visibilitychange on iOS Safari
document.addEventListener("visibilitychange", function(){
  if(document.hidden) stopScanner();
});
window.addEventListener("pagehide", function(){ stopScanner(); });
</script>
</body>
